# The platform console. Not a dealership surface at all — it lists tenants and
# leads — so it is the last thing that should ever appear in a search result.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

# Token surfaces. These carry no session — a customer opening a menu link and a
# tablet on the drive are not signed-in users — but they are not marketing
# either, and the URL itself is the credential. Indexing one, or letting a
# proxy keep a copy, would be the same leak as indexing the workspace.
[[headers]]
  for = "/m/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/invite/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/present"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"
